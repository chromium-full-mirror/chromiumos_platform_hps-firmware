[package]
name = "stage0"
version = "0.1.0"
authors = ["Edward O'Callaghan <quasisec@google.com>"]
edition = "2018"
license = "BSD-3-Clause"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitflags = "1.2.1"
cortex-m = "0.7.1"
cortex-m-rt = "0.6.13"
cortex-m-rtic = "0.5.5"
defmt = "0.2.1"
defmt-rtt = "0.2.0"
i2c_protocol = { path = "../i2c_protocol" }  # provided by ebuild
mcu_common = { path = "../mcu_common" }  # provided by ebuild
panic-halt = "0.2.0"
i2c_peripheral = { path = "../i2c_peripheral" }  # provided by ebuild
stm32g0_i2c_peripheral = { path = "../stm32g0_i2c_peripheral" }  # provided by ebuild
# TODO(dml): Update to a later version of stm32g0xx-hal once b/200756174 is
# better understood.
hal = { package = "stm32g0xx-hal", version = "=0.1.0", features = ["rt", "stm32g071"]}
ed25519-compact = { version = "0.1.9", default-features = false }

[features]
# If enabled, the first 1KB of flash will be left empty. The system bootloader
# will still run on startup and commands will need to be sent to the system
# bootloader into order to jump to stage0.
sys_bootloader = []
# set logging levels here
default = [
  "defmt-default",
]
# do NOT modify these features
defmt-default = []
defmt-trace = []
defmt-debug = []
defmt-info = []
defmt-warn = []
defmt-error = []


no-i2c-clock-stretching = []

# Optimize all dependencies
[profile.dev.package."*"]
opt-level = "z"
codegen-units = 1

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1

[profile.dev]
lto = true
opt-level = "z"
panic = "abort"

[profile.release]
debug = true
lto = true
opt-level = "z"
panic = "abort"
