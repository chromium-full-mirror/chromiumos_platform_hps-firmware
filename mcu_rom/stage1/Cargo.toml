[package]
name = "stage1"
version = "0.1.0"
authors = ["Edward O'Callaghan <quasisec@google.com>"]
edition = "2018"
license = "BSD-3-Clause"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cortex-m = "0.7.1"
cortex-m-rt = "0.6.13"
defmt = "0.2.1"
git-version = "0.3.4"
hmac-sha256 = "0.1.6"
mcu_common = { path = "../mcu_common" }
panic-reset = "0.1.0"
spi-memory = "0.2.0"
stm32g0xx-hal = { package = "stm32g0xx-hal", version = "0.1.0", features = ["rt", "stm32g071"]}
ufmt = "0.1.0"
ufmt-write = "0.1.0"

[features]
# Build stage1_app such that it can be booted directly.
freestanding_stage1 = []

# Optimize all dependencies
[profile.dev.package."*"]
opt-level = "z"

[profile.release.package."*"]
opt-level = "z"

[profile.dev]
lto = true
opt-level = "z"
panic = "abort"

[profile.release]
debug = true
lto = true
opt-level = "z"
panic = "abort"
