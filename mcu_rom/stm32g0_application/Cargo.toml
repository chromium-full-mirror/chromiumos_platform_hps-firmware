[package]
name = "stm32g0_application"
version = "0.1.0"
edition = "2018"
license = "BSD-3-Clause"

[dependencies]
application = { path = "../application" }
cortex-m = "0.7.1"
cortex-m-rt = "0.6.13"
cortex-m-rtic = "0.5.5"
embedded-hal = "0.2.4"
hal = { package = "stm32g0xx-hal", git = "https://github.com/stm32-rs/stm32g0xx-hal.git", rev = "30f950ca9ae60ac178e69a38e77f05d12c4e9be4", features = ["rt"]}
i2c_peripheral = { path = "../i2c_peripheral" }
i2c_protocol = { path = "../i2c_protocol" }
mcu_common = { path = "../mcu_common" }
panic-rtt-target = { version = "0.1.2", features = ["cortex-m"] }
rtt-target = { version = "0.3.1", features = ["cortex-m"] }
spi-memory = "0.2.0"
stm32g0 = "0.13.0"
stm32g0_i2c_peripheral = { path = "../stm32g0_i2c_peripheral", default-features = false }

[features]
default = [
  "defmt-default",
  "nucleo"
]
# The following features should be left unmodified.
defmt-default = []
defmt-trace = []
defmt-debug = []
defmt-info = []
defmt-warn = []
defmt-error = []

proto0 = ["hal/stm32g031", "stm32g0_i2c_peripheral/stm32g031" ]
nucleo = ["hal/stm32g071", "stm32g0_i2c_peripheral/stm32g071"]
proto1 = ["hal/stm32g071", "stm32g0_i2c_peripheral/stm32g071"]
proto2 = ["hal/stm32g071", "stm32g0_i2c_peripheral/stm32g071"]

no-i2c-clock-stretching = []

# Optimize all dependencies
[profile.dev.package."*"]
opt-level = "z"
codegen-units = 1

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1

[profile.dev]
lto = true
opt-level = "z"
panic = "abort"

[profile.release]
debug = true
lto = true
opt-level = "z"
panic = "abort"
