[target.thumbv6m-none-eabi]
runner = 'probe-run --probe 0483:374b --chip stm32g071'
linker = "ld.lld"
rustflags = [
  "-C", "link-arg=-Tlink.x",
  # We need this so that we have a symbol for the start of our vector table.
  "-C", "link-arg=-T../hps-common-link.x",
]

[build]
target = "thumbv6m-none-eabi" # Cortex-M0 and Cortex-M0+
