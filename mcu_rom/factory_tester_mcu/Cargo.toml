[package]
name = "factory_tester_mcu"
version = "0.1.0"
edition = "2018"

[dependencies]
cortex-m = "0.7.1"
cortex-m-rt = "0.6.13"
cortex-m-rtic = "0.5.5"
debug_logger = { path = "../debug_logger" }
delayed_i2c = { path = "../delayed_i2c" }
embedded-hal = "0.2.6"
factory_tester_common = { path = "../factory_tester_common" }
gateware_compress = { path = "../gateware_compress" }
hal = { package = "stm32g0xx-hal", version = "0.1.0", features = ["rt", "stm32g071"]}
hm01b0 = { path = "../hm01b0" }
log = {version = "0.4.14", features = [ "release_max_level_off" ] }
panic-halt = "0.2.0"
panic-rtt-target = { version = "0.1.2", features = ["cortex-m"], optional = true }
rtt-target = { version = "0.3.1", features = ["cortex-m"], optional = true }
spi-memory = "0.2.0"
stm32g0 = "0.13.0"

[build-dependencies]
gateware_compress = { path = "../gateware_compress" }

[features]
default = ["dev"]
# Targets STM32 flash instead of RAM. Enables debugging features.
dev = ["panic-rtt-target", "debug_logger/dev", "rtt-target"]

# Optimize all dependencies
[profile.dev.package."*"]
opt-level = "z"
codegen-units = 1

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1

[profile.dev]
lto = true
opt-level = "z"
panic = "abort"

[profile.release]
debug = true
lto = true
opt-level = "z"
panic = "abort"
