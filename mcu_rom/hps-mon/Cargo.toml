[package]
name = "hps-mon"
version = "0.1.0"
edition = "2018"

[dependencies]
anyhow = "1.0.40"
argh = "0.1.4"
bayer = "0.1.5"
colored = "2.0.0"
crc = "2.0"
hps_interface = { path = "../hps_interface" }
image = { version = "0.23.14", default-features = false, features = ["png"] }
mcp2221 = { path = "../mcp2221" }
mcu_common = { path  = "../mcu_common" }
probe-rs = { version = "0.10.1", optional = true }
probe-rs-rtt = { version = "0.10.1", optional = true }
rustyline = "8.2.0"

[features]
direct  = [ "probe-rs", "probe-rs-rtt" ]
