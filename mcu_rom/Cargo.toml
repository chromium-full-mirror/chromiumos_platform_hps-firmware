[workspace]

# Crates that are arch-independent go here.
members = [
    "application",
    "debug_logger",
    "delayed_i2c",
    "factory_tester_common",
    "fake_i2c",
    "gateware_compress",
    "hm01b0",
    "host_dev_common",
    "hps_interface",
    "hps-factory",
    "hps-util",
    "hps-mon",
    "i2c_peripheral",
    "i2c_protocol",
    "libstage0",
    "mcp2221",
    "mcu_common",
    "sign-rom",
    "stm32_bootloader_client",
]
# Crates that can only run on the MCU go here. The MCU binaries can't go into a
# workspace since they each have their own memory.x. If we get more than one
# library, then we might want to consider moving the stm32 libraries into a
# workspace.
exclude = [
    "factory_tester",
    "factory_tester_mcu",
    "one_time_init",
    "stage0",
    "stage1_app",
    "stm32g0_i2c_peripheral"
]
