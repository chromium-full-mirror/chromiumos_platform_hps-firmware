[package]
name = "stage1_app"
version = "0.1.0"
edition = "2018"
license = "BSD-3-Clause"

[dependencies]
application = { path = "../application" }
cortex-m = "0.7.1"
cortex-m-rt = "0.6.13"
cortex-m-rtic = "0.5.5"
crc = "2.0"
embedded-hal = "0.2.4"
git-version = "0.3.4"
# TODO(dml): Update to a later version of stm32g0xx-hal once b/200756174 is
# better understood.
hal = { package = "stm32g0xx-hal", version = "=0.1.0", features = ["rt"]}
hmac-sha256 = "0.1.6"
i2c_peripheral = { path = "../i2c_peripheral" }
i2c_protocol = { path = "../i2c_protocol" }
mcu_common = { path = "../mcu_common" }
panic-rtt-target = { version = "0.1.2", features = ["cortex-m"] }
rtt-target = { version = "0.3.1", features = ["cortex-m"] }
spi-memory = "0.2.0"
stm32g0 = "0.13.0"
stm32g0_i2c_peripheral = { path = "../stm32g0_i2c_peripheral", default-features = false }

[features]
default = [
  "proto2"
]

nucleo = ["hal/stm32g071", "stm32g0_i2c_peripheral/stm32g071"]
proto2 = ["hal/stm32g071", "stm32g0_i2c_peripheral/stm32g071"]

no-i2c-clock-stretching = []

# Build application to be loaded in the second part of flash as stage1.
stage1 = []

# Optimize all dependencies
[profile.dev.package."*"]
opt-level = "z"
codegen-units = 1

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1

[profile.dev]
lto = true
opt-level = "z"
panic = "abort"

[profile.release]
debug = true
lto = true
opt-level = "z"
panic = "abort"
