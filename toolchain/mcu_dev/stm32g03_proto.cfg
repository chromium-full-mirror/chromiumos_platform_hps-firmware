# This is an STM32G03 HPS proto board with a single STM32G031G4U6 chip.

source [find interface/stlink.cfg]

transport select hla_swd

source [find target/stm32g0x.cfg]

# Error: timed out while waiting for target halted
#  - The error happens because while the device is in the sleep mode, OpenOCD
#    cannot properly connect to it over JTAG.
#
# The connect_assert_rst flag will force OpenOCD to reset the CPU during the
# initial connection, forcing it out of the sleep mode and ensuring that the
# debug communication succeeds.
#
# The gates tokens control flags that describe some cases where JTAG may be
# unavailable during reset. srst_nogate, indicates that JTAG commands can
# safely be issued while SRST is active.
reset_config srst_nogate connect_assert_srst

# Hook gdb attach event
$_TARGETNAME configure -event gdb-attach {
  halt
  wait_halt 100
  reset init
  flash probe 0
}
