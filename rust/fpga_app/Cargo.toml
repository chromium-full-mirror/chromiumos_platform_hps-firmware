[package]
name = "fpga_app"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
application = { path = "../application" }
bitflags = "1.3.2"
embedded-hal = "0.2.4"
hm01b0 = { path = "../hm01b0" }
log = "0.4.14"
mcu_common = { path = "../mcu_common" }
num_enum = { version = "0.5.1", default-features = false }

[dev-dependencies]
embedded-hal-mock = "0.8.0"
image = { version = "0.23.14", default-features = false, features = ["png"] }
mcu_common = { path = "../mcu_common", features = [ "std" ] }

[build-dependencies]
image = { version = "0.23.14", default-features = false, features = ["png"] }
anyhow = "1.0.38"

[features]
image-transfer = [ "application/image-transfer" ]
dev = [ "application/dev" ]
self-test = []
