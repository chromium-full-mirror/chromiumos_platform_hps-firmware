[package]
name = "one_time_init"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
cortex-m = "0.7.3"
cortex-m-rt = "0.6.13"
cortex-m-rtic = "1.1.3"
hal = { package = "stm32g0xx-hal", version = "=0.1.5", features = ["rt", "stm32g071"]}
i2c_peripheral = { path = "../../i2c_peripheral" }
i2c_protocol = { path = "../../i2c_protocol" }
mcu_common = { path = "../../mcu_common" }
panic-halt = "0.2.0"
stm32g0 = "0.13.0"
stm32g0_i2c_peripheral = { path = "../stm32g0_i2c_peripheral", default-features = false }

[build-dependencies]
mcu_common = { path = "../../mcu_common", features = [ "std" ] }
