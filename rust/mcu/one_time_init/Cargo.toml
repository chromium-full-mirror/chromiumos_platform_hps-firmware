[package]
name = "one_time_init"
version = "0.1.0"
edition = "2018"
license = "BSD-3-Clause"
resolver = "2"

[dependencies]
cortex-m = "0.7.1"
cortex-m-rt = "0.6.13"
cortex-m-rtic = "0.5.5"
hal = { package = "stm32g0xx-hal", version = "=0.1.0", features = ["rt", "stm32g071"]}
mcu_common = { path = "../../mcu_common" }
panic-halt = "0.2.0"
stm32g0 = "0.13.0"

[build-dependencies]
mcu_common = { path = "../../mcu_common", features = [ "std" ] }
