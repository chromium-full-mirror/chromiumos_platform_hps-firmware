[package]
name = "factory_tester_mcu"
version = "0.1.0"
edition = "2018"
license = "BSD-3-Clause"
resolver = "2"

[dependencies]
cortex-m = "0.7.1"
cortex-m-rt = "0.6.13"
cortex-m-rtic = "0.5.5"
debug_logger = { path = "../../debug_logger" }
delayed_i2c = { path = "../../delayed_i2c" }
embedded-hal = "0.2.6"
factory_tester_common = { path = "../../factory_tester_common" }
gateware_compress = { path = "../../gateware_compress" }
hal = { package = "stm32g0xx-hal", version = "0.1.0", features = ["rt", "stm32g071"]}
hm01b0 = { path = "../../hm01b0" }
log = {version = "0.4.14", features = [ "release_max_level_off" ] }
mcu_common = { path = "../../mcu_common" }
panic-halt = "0.2.0"
panic-rtt-target = { version = "0.1.2", features = ["cortex-m"], optional = true }
rtt-target = { version = "0.3.1", features = ["cortex-m"], optional = true }
spi-memory = "0.2.0"
stm32g0 = "0.13.0"

[build-dependencies]
gateware_compress = { path = "../../gateware_compress" }
mcu_common = { path = "../../mcu_common", features = [ "std" ] }

[features]
default = ["dev"]
# Targets STM32 flash instead of RAM. Enables debugging features.
dev = ["panic-rtt-target", "debug_logger/dev", "rtt-target"]

# Checks that we get data from the camera. This doesn't work sufficiently
# reliably at the moment to be on by default.
check-image-data = []

# Production configuration when loaded into flash by stage0, as opposed to our
# default configuration where we're loaded into RAM by the system bootloader.
stage1 = []
