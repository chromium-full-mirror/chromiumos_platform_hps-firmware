[package]
name = "stage0"
version = "0.1.0"
authors = ["Edward O'Callaghan <quasisec@google.com>"]
edition = "2018"
license = "BSD-3-Clause"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cortex-m = "0.7.1"
cortex-m-rt = "0.6.13"
cortex-m-rtic = "0.5.5"
i2c_protocol = { path = "../../i2c_protocol" }  # provided by ebuild
libstage0 = { path = "../../libstage0" }
mcu_common = { path = "../../mcu_common" }  # provided by ebuild
panic-halt = "0.2.0"
i2c_peripheral = { path = "../../i2c_peripheral" }  # provided by ebuild
stm32g0_i2c_peripheral = { path = "../stm32g0_i2c_peripheral" }  # provided by ebuild
# TODO(dml): Update to a later version of stm32g0xx-hal once b/200756174 is
# better understood.
hal = { package = "stm32g0xx-hal", version = "=0.1.0", features = ["rt", "stm32g071"]}
stm32g0_utils = { path = "../stm32g0_utils" }

[build-dependencies]
mcu_common = { path = "../../mcu_common" }

[features]
# If enabled, the first 1KB of flash will be left empty. The system bootloader
# will still run on startup and commands will need to be sent to the system
# bootloader into order to jump to stage0.
sys_bootloader = []
no-i2c-clock-stretching = []
