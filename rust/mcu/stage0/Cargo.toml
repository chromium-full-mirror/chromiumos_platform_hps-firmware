[package]
name = "stage0"
version = "0.1.0"
authors = ["Edward O'Callaghan <quasisec@google.com>"]
edition = "2021"
license = "BSD-3-Clause"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cortex-m = "0.7.3"
cortex-m-rt = "0.6.13"
cortex-m-rtic = "1.1.3"
i2c_protocol = { path = "../../i2c_protocol" }
libstage0 = { path = "../../libstage0" }
mcu_common = { path = "../../mcu_common" }
panic-halt = "0.2.0"
i2c_peripheral = { path = "../../i2c_peripheral" }
stm32g0_i2c_peripheral = { path = "../stm32g0_i2c_peripheral" }
hal = { package = "stm32g0xx-hal", version = "=0.1.5", features = ["rt", "stm32g071"]}

[build-dependencies]
anyhow = "1.0.38"
ed25519-compact = { version = "1", default-features = false, features = [ "pem", "std", "opt_size" ] }
mcu_common = { path = "../../mcu_common" }

[features]
default = ["mp-key"]

# If enabled, the first 1KB of flash will be left empty. The system bootloader
# will still run on startup and commands will need to be sent to the system
# bootloader into order to jump to stage0.
sys_bootloader = []
no-i2c-clock-stretching = []

# Exactly one of these features must be enabled, to select
# which key will be compiled into stage0.
insecure-dev-key = []
premp-key = []
mp-key = []
