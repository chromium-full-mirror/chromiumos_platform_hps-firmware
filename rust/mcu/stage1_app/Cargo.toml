[package]
name = "stage1_app"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
application = { path = "../../application" }
cortex-m = "0.7.3"
cortex-m-rt = "0.6.13"
cortex-m-rtic = "1.1.3"
crc = "2.0"
debug_logger = { path = "../../debug_logger" }
embedded-hal = "0.2.4"
hal = { package = "stm32g0xx-hal", version = "=0.1.5", features = ["rt"]}
hm01b0 = { path = "../../hm01b0" }
hmac-sha256 = "0.1.6"
i2c_peripheral = { path = "../../i2c_peripheral" }
i2c_protocol = { path = "../../i2c_protocol" }
log = {version = "0.4.14", features = [ "release_max_level_off" ] }
mcu_common = { path = "../../mcu_common" }
rtt-target = { version = "0.3.1", features = ["cortex-m"] }
spi-memory = "0.2.0"
stm32g0 = "0.13.0"
stm32g0_i2c_peripheral = { path = "../stm32g0_i2c_peripheral", default-features = false }

[build-dependencies]
hmac-sha256 = "0.1.6"
mcu_common = { path = "../../mcu_common", features = [ "std" ] }

[features]
default = [
  "proto2"
]

nucleo = ["hal/stm32g071", "stm32g0_i2c_peripheral/stm32g071"]
proto2 = ["hal/stm32g071", "stm32g0_i2c_peripheral/stm32g071"]

no-i2c-clock-stretching = []

# Build application such that it can be flashed as standalone.
standalone = []

# NOTE: if you add or rename any features here, also carefully check in src/header.rs
# that the 'taint' header field will still be set appropriately!

dev = [ "debug_logger/dev", "application/dev", "mcu_common/dev" ]

# This is intended for internal testing only. Must never be enabled in
# production.
image-transfer = [ "application/image-transfer" ]

# This is intended for internal testing only. Must never be enabled in
# production.
no-hash-check = []
