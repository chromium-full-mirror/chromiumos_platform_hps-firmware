[package]
name = "hps-util"
version = "0.1.0"
edition = "2018"
license = "BSD-3-Clause"

[dependencies]
anyhow = "1.0.38"
clap = "=3.0.0-beta.2"
embedded-hal = "0.2.4"
hps_interface = { path = "../hps_interface" }
mcp2221 = { path = "../mcp2221" }
mcu_common = { path = "../mcu_common" }
serialport = "4.0.1"

dbus = { version = "0.9.2", optional = true }
dbus-tokio = { version = "0.7.3", optional = true }
futures = { version = "0.3.14", optional = true }
dbus-crossroads = { version = "0.5.0", optional = true }
tokio = { version = "1.5.0", features = ["rt"], optional = true }

[features]
daemon = [ "dbus", "dbus-tokio", "futures", "dbus-crossroads", "tokio" ]
