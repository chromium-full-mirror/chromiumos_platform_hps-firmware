[package]
name = "hps-util"
version = "0.1.0"
edition = "2018"
license = "BSD-3-Clause"

[dependencies]
anyhow = "1.0.38"
argh = "0.1.4"
embedded-hal = "0.2.4"
ftd2xx-embedded-hal = { version = "0.7.0", optional = true }
hps_interface = { path = "../hps_interface" }
mcp2221 = { path = "../mcp2221" }
mcu_common = { path = "../mcu_common" }
serialport = "4.0.1"

dbus = "0.9.2"
dbus-tokio = "0.7.3"
futures = "0.3.14"
